<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Synth Arcade</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="header">
        <div class="logo-area">
            <img src="icon.png" alt="Logo" class="logo-icon-img">
            <span>Synth Arcade</span>
        </div>
        <div class="time" id="clock">10:01</div>
    </div>

    <div class="arcade-grid">
        <a href="game/confess.html" class="arcade-card">
            <div class="thumbnail-container">
                <div>
                    <div class="thumbnail-text">confess<br>crush<br>action</div>
                    <div class="thumbnail-footer">Powered by Google Forms</div>
                </div>
            </div>
            <div class="card-title">Confession Wall</div>
            <div class="card-author">by Synth</div>
        </a>
    </div>

    <script>
        function updateTime() {
            const now = new Date();
            let hours = now.getHours();
            let minutes = now.getMinutes();
            minutes = minutes < 10 ? '0' + minutes : minutes;
            document.getElementById('clock').textContent = hours + ':' + minutes;
        }

        updateTime();
        setInterval(updateTime, 1000);
    </script>

</body>
</html>
