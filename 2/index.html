<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Synth Arcade</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="header">
        <div class="logo-area">
            <img src="icon.png" alt="Logo" class="logo-icon-img">
            <span>Synth Arcade</span>
        </div>
        <div class="time" id="clock">11:01</div>
    </div>

    <!-- Section 1: Simple by Synth -->
    <div class="section-heading">Simple by Synth</div>
    <div class="arcade-grid horizontal-grid">
        <a href="game/confess.html" class="arcade-card">
            <div class="thumbnail-container">
                <img src="icon/confess.png" alt="Confess" class="thumbnail-img">
            </div>
            <div class="card-title">Confession Wall</div>
            <div class="card-author">by Synth</div>
        </a>

        <a href="#" class="arcade-card">
            <div class="thumbnail-container filled-black-container">
                <img src="icon/soon.png" alt="Chat Coming Soon" class="thumbnail-img">
            </div>
            <div class="card-title">Chat</div>
            <div class="card-author">By Synth</div>
        </a>
    </div>

    <!-- Section 2: Minecraft -->
    <div class="section-heading">Minecraft</div>
    <div class="arcade-grid horizontal-grid">
        <a href="game/synth-mcwl.html" class="arcade-card">
            <div class="thumbnail-container">
                <img src="icon/mcwl.png" alt="MCWL" class="thumbnail-img">
            </div>
            <div class="card-title">MCWL</div>
            <div class="card-author">Minecraft Web Launcher</div>
        </a>
    </div>

    <script>
        function updateTime() {
            const now = new Date();
            let hours = now.getHours();
            let minutes = now.getMinutes();
            minutes = minutes < 10 ? '0' + minutes : minutes;
            document.getElementById('clock').textContent = hours + ':' + minutes;
        }

        updateTime();
        setInterval(updateTime, 1000);
    </script>

</body>
</html>
